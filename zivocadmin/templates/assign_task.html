{% extends "base.html" %}

{% block title %}Assign Task · Zivoc Admin{% endblock %}

{% block body %}
<div class="shell">
    {% set active = "tasks" %}
    {% include "_sidebar.html" %}
        <main class="content">
            <a class="back-link" href="{{ url_for('tasks_page') }}">&larr; Back to people</a>
            <h1>Assign Task</h1>
            <p class="lead">To <strong>{{ person_name }}</strong> &middot; {{ role }}</p>

            {% if error %}
            <div class="notice err">{{ error }}</div>
            {% endif %}

            <form class="task-form" method="post" action="{{ url_for('assign_task') }}">
                <input type="hidden" name="user" value="{{ person.name }}">
                <input type="hidden" name="role" value="{{ role }}">

                <label for="title">Task name</label>
                <input id="title" name="title" type="text" maxlength="200" required value="{{ title }}">

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="7">{{ description }}</textarea>

                <button class="btn-primary" type="submit">Submit</button>
            </form>
        </main>
    </div>
</div>
{% endblock %}
