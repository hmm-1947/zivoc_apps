<aside class="sidebar" id="sidebar">
    <div class="brand">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="32" height="32">
        <span>Zivoc Admin</span>
    </div>
    <nav class="nav">
        <a class="nav-item {{ 'active' if active == 'home' }}" href="{{ url_for('index') }}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            <span>Home</span>
        </a>
        <a class="nav-item {{ 'active' if active == 'tasks' }}" href="{{ url_for('tasks_page') }}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="m9 14 2 2 4-4"/></svg>
            <span>Add Task</span>
        </a>
        <a class="nav-item" href="{{ url_for('erp') }}">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Zivoc ERP</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="avatar">
            {% if user.picture %}
            <img src="{{ user.picture }}" alt="">
            {% else %}
            {{ user.name[:1] | upper }}
            {% endif %}
        </div>
        <div class="who">
            <strong>{{ user.name }}</strong>
            <small>{{ user.email }}</small>
        </div>
    </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
    <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <form method="post" action="{{ url_for('logout') }}">
            <button class="btn-ghost" type="submit">Sign out</button>
        </form>
    </header>
